name: publish

# Tag-triggered, so publishing is a deliberate act with a reviewable name.
#   git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm Trusted Publishing: GitHub mints a short-lived OIDC token
  # that npm verifies, so there is no long-lived NPM_TOKEN in this repo at all.
  # It is also what makes provenance attestation possible.
  id-token: write

jobs:
  # Publishing a red build is the one thing this workflow must never do, so the
  # full CI matrix runs first and this job cannot start unless it passes.
  gates:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing requires Node >= 22.14.0.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # Trusted Publishing requires npm >= 11.5.1, which is newer than the npm
      # bundled with Node 22.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # A tag that disagrees with package.json publishes a version nobody asked
      # for and cannot be taken back. Fail loudly instead.
      - name: Tag must match package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # Refuse to republish an existing version, which npm rejects anyway, but
      # failing here gives a readable reason instead of a registry error.
      - name: Version must not already be published
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "telegram-utils@$PKG" version >/dev/null 2>&1; then
            echo "::error::telegram-utils@$PKG is already on the registry. Bump the version."
            exit 1
          fi

      # No NODE_AUTH_TOKEN: authentication is the OIDC token from the
      # id-token: write permission above. --provenance links the published
      # tarball to this commit and workflow, so consumers can verify where it
      # came from.
      - name: Publish
        run: npm publish --provenance --access public
